name: Update Profile Assets

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout profile
        uses: actions/checkout@v4

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: MOHAMED020EGY01
          outputs: |
            assets/github-contribution-grid-snake.svg
            assets/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Generate language distribution chart
        env:
          GH_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN || github.token }}
        run: |
          python <<'PY'
          import json
          import math
          import os
          import urllib.request
          from pathlib import Path

          user = "MOHAMED020EGY01"
          token = os.environ.get("GH_TOKEN", "")
          has_private_token = bool(os.environ.get("PROFILE_STATS_TOKEN"))

          def get_json(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      **({"Authorization": f"Bearer {token}"} if token else {}),
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          if has_private_token:
              repos = get_json(
                  "https://api.github.com/user/repos?per_page=100&type=all&affiliation=owner"
              )
          else:
              repos = get_json(
                  f"https://api.github.com/users/{user}/repos?per_page=100"
              )

          totals = {}
          for repo in repos:
              if repo.get("fork"):
                  continue

              languages_url = repo.get("languages_url")
              if not languages_url:
                  continue

              try:
                  languages = get_json(languages_url)
              except Exception:
                  continue

              for language, bytes_count in languages.items():
                  totals[language] = totals.get(language, 0) + bytes_count

          total = sum(totals.values())
          top = sorted(totals.items(), key=lambda item: item[1], reverse=True)[:8]

          colors = [
              "#58A6FF", "#A371F7", "#3FB950", "#F0883E",
              "#F778BA", "#79C0FF", "#D29922", "#8B949E"
          ]

          width, height = 900, 430
          cx, cy, radius = 250, 215, 140

          def polar(angle, r):
              a = math.radians(angle - 90)
              return cx + r * math.cos(a), cy + r * math.sin(a)

          def arc_path(start, end):
              x1, y1 = polar(start, radius)
              x2, y2 = polar(end, radius)
              large = 1 if end - start > 180 else 0
              return f"M {cx} {cy} L {x1:.2f} {y1:.2f} A {radius} {radius} 0 {large} 1 {x2:.2f} {y2:.2f} Z"

          parts = [
              f'<svg xmlns="http://www.w3.org/2000/svg" width="{width}" height="{height}" viewBox="0 0 {width} {height}">',
              '<rect width="100%" height="100%" rx="24" fill="#0d1117"/>',
              '<text x="48" y="54" fill="#f0f6fc" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700">Language Distribution</text>',
              '<text x="48" y="82" fill="#8b949e" font-family="Arial,Helvetica,sans-serif" font-size="14">Code bytes across repositories</text>',
          ]

          angle = 0
          if total:
              for i, (language, value) in enumerate(top):
                  pct = value / total * 100
                  sweep = pct / 100 * 360
                  if pct >= 99.999:
                      parts.append(f'<circle cx="{cx}" cy="{cy}" r="{radius}" fill="{colors[i % len(colors)]}"/>')
                  else:
                      parts.append(
                          f'<path d="{arc_path(angle, angle + sweep)}" fill="{colors[i % len(colors)]}"/>'
                      )
                  angle += sweep
          else:
              parts.append(f'<circle cx="{cx}" cy="{cy}" r="{radius}" fill="#21262d"/>')

          parts += [
              f'<circle cx="{cx}" cy="{cy}" r="84" fill="#0d1117"/>',
              f'<text x="{cx}" y="{cy-6}" text-anchor="middle" fill="#f0f6fc" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700">{len(repos)}</text>',
              f'<text x="{cx}" y="{cy+18}" text-anchor="middle" fill="#8b949e" font-family="Arial,Helvetica,sans-serif" font-size="13">repositories</text>',
          ]

          y = 130
          for i, (language, value) in enumerate(top):
              pct = value / total * 100 if total else 0
              color = colors[i % len(colors)]
              parts.append(f'<circle cx="485" cy="{y-5}" r="6" fill="{color}"/>')
              parts.append(f'<text x="502" y="{y}" fill="#f0f6fc" font-family="Arial,Helvetica,sans-serif" font-size="16">{language}</text>')
              parts.append(f'<text x="820" y="{y}" text-anchor="end" fill="#8b949e" font-family="Arial,Helvetica,sans-serif" font-size="15">{pct:.1f}%</text>')
              y += 34

          scope = "all owned repositories" if has_private_token else "public repositories"
          parts.append(f'<text x="48" y="395" fill="#6e7681" font-family="Arial,Helvetica,sans-serif" font-size="12">Source: GitHub language analysis • {scope}</text>')
          parts.append("</svg>")

          Path("assets").mkdir(exist_ok=True)
          Path("assets/language-distribution.svg").write_text("\n".join(parts), encoding="utf-8")
          PY

      - name: Commit updated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          if git diff --cached --quiet; then
            echo "No asset changes."
            exit 0
          fi
          git commit -m "chore: update profile assets [skip ci]"
          git push
